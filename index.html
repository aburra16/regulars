<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regulars</title>
    <meta name="description" content="Places to eat and drink, rated by people you'd actually ask." />
    <!-- The house's logo, from the site itself (tools/house-icons.sh). The tab icons have no ground, so they sit
         on the tab bar in either theme; the 64 px one is for screens of twice the density. The theme colour is
         the page's ground, in each theme. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10161F" media="(prefers-color-scheme: dark)" />
    <!-- The theme, before the page is first drawn: the person's choice on this device, or else the
         device's setting. A choice gives the browser's bar its colour too. src/theme/theme.ts takes
         over from here; tests/theme.test.tsx runs this and checks the two agree. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("regulars.theme");
        } catch (e) {}
        var chosen = theme === "light" || theme === "dark";
        if (!chosen) theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
        if (chosen) {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", theme === "dark" ? "#10161F" : "#FFFFFF");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
