name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Optional. When the secret is absent this is an empty string and the app builds without a map.
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
      # GitHub Pages serves 404.html for unknown paths; a copy of the app shell lets deep links such as /place/abc load.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job can write to Pages. The build job, which runs the project's own code, can only read.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Needs the Pages permission (it calls the Pages API), so it runs here and not in the build job.
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
