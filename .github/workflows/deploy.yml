name: Deploy

on:
  push:
    branches: [main]
  # Each day, so the pages a shared link opens keep up with the list: a place added since the last
  # deploy opens in the app, and its link shows only the general preview until then.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # A page for each place, chain and fixed page, with its own title and preview, read from the hub's
      # list (tools/share-pages.ts). Without an answer from the hub, or with too few places, it fails, and
      # nothing is published: the site already live stays.
      - run: npm run share-pages
      # GitHub Pages serves 404.html for unknown paths; a copy of the app shell lets deep links such as /place/abc load.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job can write to Pages. The build job, which runs the project's own code, can only read.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Needs the Pages permission (it calls the Pages API), so it runs here and not in the build job.
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
