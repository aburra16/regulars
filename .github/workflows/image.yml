name: Image

# The site as a container image, for the NosFabrica cluster (brainstorm-k8s, charts/regulars).
# Tags: sha-<short> and latest from main, and the version from a v1.2.3 tag. The Pages deploy
# (deploy.yml) and the Android release (android-release.yml) are untouched by this.

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Each day, as deploy.yml, so the pages a shared link opens keep up with the list. The day's
  # rebuild of a commit replaces its sha-<short> image with one carrying the day's pages.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The same bar as deploy.yml: nothing is pushed unless the tests pass.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Node pin is consistent
        run: |
          pin="$(tr -d '[:space:]' < .nvmrc)"
          grep -q "^FROM node:${pin}-alpine" Dockerfile \
            || { echo "Dockerfile base image != .nvmrc ($pin)"; exit 1; }

      - name: Compute lowercase image name
        id: img
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A new value each run, so the share-pages layer is rebuilt every time (Dockerfile).
          build-args: |
            PAGES_STAMP=${{ github.run_id }}
