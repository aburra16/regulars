# Serves the built site (dist/). What GitHub Pages did, and the headers it could not send.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/manifest+json;

    # Vite names these files by their content, so a name never changes what it serves.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # For the cluster's probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A shared link's own page first (/place/<d> -> place/<d>.html, written by npm run share-pages,
    # with that place's title and preview; $uri is already decoded, as the file names are), then
    # the app shell for any other path, so a link straight to a page loads, as 404.html did on
    # Pages, but with a 200. These pages are checked on every load, so a new deploy is picked up at
    # once; they name the hashed files above.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }
}
